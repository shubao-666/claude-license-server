<!DOCTYPE html>

  <style>

    body { background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%); color:#e0e6f0; line-height:1.6; }
    .hero { text-align:center; padding:60px 20px; }
    .shield-icon { width:80px; height:80px; background: linear-gradient(135deg,#06b6d4,#8b5cf6); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto 20px; }

    .buy-box { background:rgba(26,37,64,0.8); border:2px solid #22d3ee; border-radius:16px; max-width:400px; margin:0 auto 40px; padding:30px; }

    .wx-id { font-size:22px; color:#fbbf24; font-weight:bold; margin:10px 0; }
    .tip { color:#94a3b8; font-size:14px; }
    .section { max-width:1000px; margin:0 auto; padding:40px 20px; }
    .section-title { text-align:center; font-size:28px; margin-bottom:30px; color:#22d3ee; }
    .features { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; }
    .feature { background:rgba(26,37,64,0.7); padding:20px; border-radius:10px; border:1px solid #2a3a5c; font-size:14px; }
    .footer { text-align:center; padding:30px; color:#4a5a75; font-size:13px; border-top:1px solid #2a3a5c; margin-top:40px; }
